name: Publish Interactive Pareto Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'copilot_pareto/**'
      - 'scripts/check_site.py'
      - '.github/workflows/publish-site.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: copilot_pareto/requirements.txt
      - name: Install plotting dependencies
        run: python -m pip install -r copilot_pareto/requirements.txt
      - name: Regenerate the four approved Python/Matplotlib charts
        run: python copilot_pareto/run_four_charts_2026-11-18.py
      - name: Validate existing chart outputs
        run: python scripts/verify_ci_outputs.py
      - name: Generate interactive historical chart data and static assets
        run: python web/build_site.py
      - name: Validate published site dataset
        run: python scripts/check_site.py
      - name: Check browser script syntax
        run: node --check web/app.js
      - name: Publish latest site JSON and chart images to public repository
        shell: bash
        run: |
          mkdir -p web/charts
          cp dist/site/data.json web/data.json
          cp dist/site/charts/* web/charts/
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add web/data.json web/charts/
          if ! git diff --cached --quiet; then
            git commit -m "Update browser dataset and approved charts [skip ci]"
            git push
          fi
      - name: Configure Pages (optional until Pages is enabled in repository Settings)
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages availability
        id: pages_status
        run: echo "enabled=${{ steps.pages_setup.outcome == 'success' }}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Upload reproducible website bundle
        uses: actions/upload-artifact@v4
        with:
          name: interactive-site-and-charts-${{ github.run_number }}
          path: dist/site/
          retention-days: 90
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4